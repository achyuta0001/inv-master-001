name: keep-alive

# Pings the deployed backend every ~10 minutes so Render's free tier does not
# spin the instance down. A cold start otherwise adds 60-180s to the first
# request (e.g. login appearing to hang before rejecting a wrong password).
#
# Note: GitHub's scheduled runners are best-effort and may lag 5-15 min under
# load, and schedules are auto-disabled after 60 days without repo activity.
# For hard guarantees use an external uptime monitor (UptimeRobot / cron-job.org)
# hitting the same /health URL.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          curl -fsS --max-time 60 https://inv-master-001.onrender.com/health \
            && echo "backend awake" \
            || echo "ping failed (cold start or downtime); next run will retry"
